name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 单测不启动 Spring 上下文、不连 Redis / MySQL（JdbcTemplate 传 null、Redis 用 Mockito）
      - name: Run tests
        run: mvn -B test
